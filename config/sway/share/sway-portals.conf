# ~/.config/xdg-desktop-portal/sway-portals.conf  (linked by installation/install_sway.sh)
# Tells xdg-desktop-portal (>= 1.18) which backend serves each portal when
# XDG_CURRENT_DESKTOP=sway. Without a matching *-portals.conf, screen sharing in
# browsers/Zoom/Teams/OBS may pick no backend or the wrong one.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
